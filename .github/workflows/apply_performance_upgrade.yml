name: Apply performance upgrade

on:
  push:
    branches:
      - perf/cache-deep-dive-v11
    paths:
      - scripts/apply_performance_patch.py
      - .github/workflows/apply_performance_upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/cache-deep-dive-v11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply guarded source patch
        run: python scripts/apply_performance_patch.py
      - name: Build validated cross-chapter cache
        run: python scripts/build_deep_dive_cache.py
      - name: Remove one-time patch machinery
        run: rm scripts/apply_performance_patch.py .github/workflows/apply_performance_upgrade.yml
      - name: Commit optimized app and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Optimize dashboard cache and deep-dive search"
          git push origin HEAD:perf/cache-deep-dive-v11
